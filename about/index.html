<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Joey Zhang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 560px;
            width: 100%;
        }

        .back {
            display: inline-block;
            margin-bottom: 2rem;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back:hover {
            color: #333;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #111;
        }

        .bio {
            line-height: 1.8;
            margin-bottom: 2rem;
            color: #444;
        }

        .timeline {
            border-left: 2px solid #e8e8e8;
            padding-left: 1.5rem;
        }

        .timeline-item {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.75rem;
            top: 0.5rem;
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }

        .timeline-item .time {
            font-size: 0.8rem;
            color: #999;
        }

        .timeline-item .role {
            font-weight: 500;
            margin-top: 0.15rem;
        }

        .timeline-item .org {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="/">← Home</a>
        <h1>About</h1>

        <div class="bio">
            <p>应用程序员，5+ 年项目管理经验。当前方向：AI 应用开发、Agent 架构，同时在补数学基础（线代/概率/优化）。</p>
        </div>

        <div class="timeline">
            <div class="timeline-item">
                <div class="time">2017 — Present</div>
                <div class="role">Software Engineer</div>
                <div class="org">HP PSSW, Shanghai</div>
            </div>
            <div class="timeline-item">
                <div class="time">2016 — 2017</div>
                <div class="role">Software Engineer / QA</div>
                <div class="org">FinTech, Shanghai</div>
            </div>
            <div class="timeline-item">
                <div class="time">2014 — 2016</div>
                <div class="role">Quality Assurance</div>
                <div class="org">Pioneer Suntec</div>
            </div>
            <div class="timeline-item">
                <div class="time">2010 — 2014</div>
                <div class="role">Computer Science</div>
                <div class="org">Shanghai Financial University</div>
            </div>
        </div>
    </div>
</body>
</html>
