<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings - Joey Zhang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container { max-width: 560px; width: 100%; position: relative; }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            color: #666;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .lang-switch:hover { border-color: #333; color: #333; }

        .back {
            display: inline-block;
            margin-bottom: 2rem;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back:hover { color: #333; }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #111;
        }

        .post-list { list-style: none; }

        .post-list li { margin-bottom: 1rem; }

        .post-list a {
            display: block;
            padding: 0.875rem 1.25rem;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.15s ease;
        }
        .post-list a:hover {
            border-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .post-title { font-weight: 500; }
        .post-date { font-size: 0.8rem; color: #999; margin-top: 0.2rem; }
        .post-tag {
            display: inline-block;
            font-size: 0.7rem;
            color: #888;
            background: #f0f0f0;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="lang-switch" onclick="toggleLang()">中文</button>

        <a class="back" href="/" data-i18n="back">← Home</a>
        <h1 data-i18n="title">Writings</h1>

        <ul class="post-list">
            <li>
                <a href="using-makefiles-for-go">
                    <div class="post-title">Using Makefile(s) for Go</div>
                    <div class="post-date">2019-12-07</div>
                    <span class="post-tag">go</span> <span class="post-tag">make</span>
                </a>
            </li>
            <li>
                <a href="researching-plan">
                    <div class="post-title" data-i18n="post2.title">Researching Plan</div>
                    <div class="post-date">2019-12-17</div>
                    <span class="post-tag" data-i18n="post2.tag">plan</span>
                </a>
            </li>
            <li>
                <a href="vim-package-management">
                    <div class="post-title">Vim Package Management</div>
                    <div class="post-date">2019-12-17</div>
                    <span class="post-tag">vim</span>
                </a>
            </li>
            <li>
                <a href="how-to-write-commit-message">
                    <div class="post-title" data-i18n="post4.title">How to Write Commit Messages</div>
                    <div class="post-date">2019-12-17</div>
                    <span class="post-tag">git</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
    const i18n = {
        en: {
            'back': '← Home',
            'title': 'Writings',
            'post2.title': 'Researching Plan',
            'post2.tag': 'plan',
            'post4.title': 'How to Write Commit Messages'
        },
        zh: {
            'back': '← 首页',
            'title': '文章',
            'post2.title': '研究计划',
            'post2.tag': '计划',
            'post4.title': '如何写好 Commit Message'
        }
    };

    function getLang() {
        return localStorage.getItem('lang') || 'en';
    }

    function setLang(lang) {
        localStorage.setItem('lang', lang);
        applyLang(lang);
    }

    function applyLang(lang) {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) el.textContent = i18n[lang][key];
        });
        document.querySelector('.lang-switch').textContent = lang === 'en' ? '中文' : 'EN';
    }

    function toggleLang() {
        setLang(getLang() === 'en' ? 'zh' : 'en');
    }

    applyLang(getLang());
    </script>
</body>
</html>
