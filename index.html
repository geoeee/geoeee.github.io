<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey Zhang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 560px;
            width: 100%;
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            color: #666;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .lang-switch:hover {
            border-color: #333;
            color: #333;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2.5rem;
        }

        .links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .links a {
            display: block;
            padding: 0.875rem 1.25rem;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }

        .links a:hover {
            border-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .links .label {
            font-weight: 500;
        }

        .links .desc {
            color: #888;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #aaa;
        }

        footer a {
            color: #888;
            text-decoration: none;
        }

        footer a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="lang-switch" onclick="toggleLang()">中文</button>

        <h1>Joey Zhang</h1>
        <p class="subtitle" data-i18n="subtitle">Software Engineer · Shanghai</p>

        <ul class="links">
            <li>
                <a href="/about/">
                    <div class="label" data-i18n="about.label">About</div>
                    <div class="desc" data-i18n="about.desc">About me</div>
                </a>
            </li>
            <li>
                <a href="/writings/">
                    <div class="label" data-i18n="writings.label">Writings</div>
                    <div class="desc" data-i18n="writings.desc">Tech blog & notes</div>
                </a>
            </li>
            <li>
                <a href="/math/">
                    <div class="label" data-i18n="math.label">Math Notes</div>
                    <div class="desc" data-i18n="math.desc">Linear algebra / Probability / Optimization</div>
                </a>
            </li>
            <li>
                <a href="https://github.com/geoeee" target="_blank">
                    <div class="label">GitHub</div>
                    <div class="desc">geoeee</div>
                </a>
            </li>
        </ul>

        <footer>
            <a href="https://github.com/geoeee/geoeee.github.io">src</a>
        </footer>
    </div>

    <script>
    const i18n = {
        en: {
            'subtitle': 'Software Engineer · Shanghai',
            'about.label': 'About',
            'about.desc': 'About me',
            'writings.label': 'Writings',
            'writings.desc': 'Tech blog & notes',
            'math.label': 'Math Notes',
            'math.desc': 'Linear algebra / Probability / Optimization'
        },
        zh: {
            'subtitle': '软件工程师 · 上海',
            'about.label': '关于',
            'about.desc': '关于我',
            'writings.label': '文章',
            'writings.desc': '技术博客与随笔',
            'math.label': '数学笔记',
            'math.desc': '线性代数 / 概率论 / 优化'
        }
    };

    function getLang() {
        return localStorage.getItem('lang') || 'en';
    }

    function setLang(lang) {
        localStorage.setItem('lang', lang);
        applyLang(lang);
    }

    function applyLang(lang) {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) el.textContent = i18n[lang][key];
        });
        document.querySelector('.lang-switch').textContent = lang === 'en' ? '中文' : 'EN';
    }

    function toggleLang() {
        setLang(getLang() === 'en' ? 'zh' : 'en');
    }

    applyLang(getLang());
    </script>
</body>
</html>
