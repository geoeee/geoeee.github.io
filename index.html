<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey Zhang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 560px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2.5rem;
        }

        .links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .links a {
            display: block;
            padding: 0.875rem 1.25rem;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }

        .links a:hover {
            border-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .links .label {
            font-weight: 500;
        }

        .links .desc {
            color: #888;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #aaa;
        }

        footer a {
            color: #888;
            text-decoration: none;
        }

        footer a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Joey Zhang</h1>
        <p class="subtitle">Software Engineer · Shanghai</p>

        <ul class="links">
            <li>
                <a href="/about">
                    <div class="label">About</div>
                    <div class="desc">关于我</div>
                </a>
            </li>
            <li>
                <a href="/writings/">
                    <div class="label">Writings</div>
                    <div class="desc">技术博客与随笔</div>
                </a>
            </li>
            <li>
                <a href="/math/" target="_blank">
                    <div class="label">Math Notes</div>
                    <div class="desc">数学笔记 — 线性代数 / 概率论 / 优化</div>
                </a>
            </li>
            <li>
                <a href="https://github.com/geoeee" target="_blank">
                    <div class="label">GitHub</div>
                    <div class="desc">geoeee</div>
                </a>
            </li>
        </ul>

        <footer>
            <a href="https://github.com/geoeee/geoeee.github.io">src</a>
        </footer>
    </div>
</body>
</html>
